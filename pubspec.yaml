name: care_circle
description: >
  CareCircle — an offline-first senior care tracking and caregiver
  handover application.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

# ---------------------------------------------------------------------------
# Dependency policy (see phases.md — "Delivery Strategy: vertical slices"):
#
# Only dependencies required by the CURRENT phase are declared here.
# Packages needed by later phases (flutter_local_notifications, share_plus,
# local_auth, url_launcher, fl_chart, hive_generator/build_runner) are added
# when their corresponding phase begins, so `flutter pub get` never pulls in
# unused native plugins for a phase that hasn't started yet.
# ---------------------------------------------------------------------------

dependencies:
  flutter:
    sdk: flutter

  # State management (architecture.md §2, §6)
  flutter_riverpod: ^2.6.1

  # Local persistence (architecture.md §2, §4)
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Non-sensitive local preferences (architecture.md §4)
  shared_preferences: ^2.3.3

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
